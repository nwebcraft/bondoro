AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Bondoro - Bonbon Drop Seal Notifier

Globals:
  Function:
    Runtime: ruby3.4
    Timeout: 60
    MemorySize: 256
    Environment:
      Variables:
        RUBYOPT: "-EUTF-8"
        DYNAMODB_PRODUCTS_TABLE: !Ref ProductsTable
        DYNAMODB_USERS_TABLE: !Ref UsersTable
        LINE_CHANNEL_SECRET: !Ref LineChannelSecret
        LINE_CHANNEL_ACCESS_TOKEN: !Ref LineChannelAccessToken
        RAKUTEN_APP_ID: !Ref RakutenAppId
        RAKUTEN_ACCESS_KEY: !Ref RakutenAccessKey
        RAKUTEN_AFFILIATE_ID: !Ref RakutenAffiliateId
        YAHOO_APP_ID: !Ref YahooAppId
        NOTIFICATION_QUEUE_URL: !Ref NotificationQueue

Parameters:
  LineChannelSecret:
    Type: String
    NoEcho: true
  LineChannelAccessToken:
    Type: String
    NoEcho: true
  RakutenAppId:
    Type: String
    NoEcho: true
  RakutenAccessKey:
    Type: String
    NoEcho: true
  RakutenAffiliateId:
    Type: String
    Default: ''
  YahooAppId:
    Type: String
    NoEcho: true
  AlertEmail:
    Type: String
    Description: Email address for error alerts

Resources:
  # Lambda Functions
  ScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/scraper.handler
      Timeout: 300
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt NotificationQueue.QueueName
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Enabled: true

  NotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/notifier.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt NotificationQueue.Arn
            BatchSize: 1

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/webhook.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        LineWebhook:
          Type: Api
          Properties:
            Path: /webhook
            Method: post

  # CloudWatch Log Groups (with retention)
  ScraperLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ScraperFunction}"
      RetentionInDays: 30

  NotifierLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NotifierFunction}"
      RetentionInDays: 30

  WebhookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WebhookFunction}"
      RetentionInDays: 30

  # SNS Topic for error alerts
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: bondoro-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # CloudWatch Alarms
  ScraperErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: bondoro-scraper-errors
      AlarmDescription: Scraper Lambda error rate
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ScraperFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  NotifierErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: bondoro-notifier-errors
      AlarmDescription: Notifier Lambda error rate
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref NotifierFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  # SQS Queue
  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: bondoro-notification-queue
      VisibilityTimeout: 120

  # DynamoDB Tables
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: bondoro-products
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: notified_status
          AttributeType: S
        - AttributeName: first_seen_at
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: notified-index
          KeySchema:
            - AttributeName: notified_status
              KeyType: HASH
            - AttributeName: first_seen_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: bondoro-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

Outputs:
  WebhookApiUrl:
    Description: LINE Webhook URL (set this in LINE Developers Console)
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/webhook"
  ScraperFunctionArn:
    Description: Scraper Lambda ARN
    Value: !GetAtt ScraperFunction.Arn
  NotifierFunctionArn:
    Description: Notifier Lambda ARN
    Value: !GetAtt NotifierFunction.Arn
  AlertTopicArn:
    Description: SNS Alert Topic ARN
    Value: !Ref AlertTopic
